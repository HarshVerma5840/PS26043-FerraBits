spring:
  application:
    name: eureka-server

server:
  port: ${SERVER_PORT:${PORT:8761}}
  address: ${SERVER_ADDRESS:0.0.0.0}

eureka:
  client:
    # Standalone registry: it does not register itself nor fetch other registries.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Demo-friendly: drop stale instances promptly instead of hiding them under
    # the default 5-minute self-preservation.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
