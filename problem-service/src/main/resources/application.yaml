spring:
  application:
    name: problem-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_problem}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:public}
  flyway:
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:${PORT:8082}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    # HMAC-SHA256 signing secret shared across services via .env; MUST be provided
    # in any real deployment.
    secret: ${JWT_SECRET:}
    issuer: sih26043
    access-token-ttl-minutes: 15
  evidence:
    storage-dir: ${EVIDENCE_STORAGE_DIR:./data/evidence}
  # Domain resolution for the AUTO_SELECTED_UNIVERSITIES access rule. Empty key →
  # the feature is unavailable and a submission using that rule is rejected with
  # 400 (fail closed, never a silent widening of the audience).
  # NOTE: inside docker the host is reached as host.docker.internal, so
  # docker-compose overrides base-url accordingly.
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:agentrouter/deepseek-v4-flash}
      # Reasoning model: reasoning_content is billed against max_tokens before the
      # answer is emitted, so a 4k budget can be spent entirely on thinking and
      # return empty content (finish_reason=length). 8k leaves headroom.
      max-tokens: 8192
      timeout-seconds: 60
    gemini:
      # API key for Google Gemini (via AI Studio or Vertex AI).
      # Required only when app.ai.domain-resolver.provider=gemini.
      # Never commit this value — set via GEMINI_API_KEY env var.
      api-key: ${GEMINI_API_KEY:}
      # Current low-latency model recommended for structured classification (Sep 2026).
      # Override via GEMINI_MODEL env var if a newer model is preferred.
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      # Max retries for transient Gemini errors (rate-limit, 5xx).
      # Authentication failures are never retried regardless of this setting.
      max-retries: ${GEMINI_MAX_RETRIES:2}
      # Low temperature for deterministic classification (range 0.0–1.0).
      temperature: ${GEMINI_TEMPERATURE:0.1}
  ai:
    domain-resolver:
      # Which provider to use for AUTO_SELECTED_UNIVERSITIES domain resolution.
      # Options: gemini | openai-compatible | deterministic (default)
      # 'deterministic' is always available as a fallback even when an AI provider is selected.
      provider: ${AI_PROVIDER:deterministic}
  # Where source-service is found. Resolves via eureka or direct Render private networking.
  source-service:
    base-url: ${SOURCE_SERVICE_URL:http://source-service:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    # Register by container/host IP so peers on the same network (or localhost)
    # can reach us — hostnames inside containers are random container ids.
    prefer-ip-address: true
