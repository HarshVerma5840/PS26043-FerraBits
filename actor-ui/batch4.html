<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIH26043 · Batch 4 Portal</title>
<link rel="stylesheet" href="actor.css">
<style>
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 12px}
  .tab{background:var(--panel);border:1px solid var(--border);color:var(--muted);
       padding:7px 14px;font-size:13px;border-radius:6px;cursor:pointer}
  .tab:hover{color:#fff}
  .tab.active{background:var(--panel2);border-color:var(--accent);color:#fff}
  .tabpanel[hidden]{display:none}

  .crow{border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:5px;background:var(--panel2);cursor:pointer}
  .crow:hover{border-color:var(--accent)}
  .row{margin-bottom:2px}
  .mono{font-family:"Cascadia Code",Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
  .statement{white-space:pre-wrap;font-size:13px;background:var(--panel);border:1px solid var(--border);
             border-radius:6px;padding:8px;max-height:340px;overflow:auto;line-height:1.5}
</style>
</head>
<body data-actor="ADMIN">

<header>
  <h1>🧪 SIH26043 Test Console <span class="who">· Batch 4</span></h1>
  <label>Base URL</label>
  <input id="baseUrl" style="width:200px">
  <button class="btn" onclick="saveBase()">Save</button>
  <span id="roleBadge" class="badge"></span>
  <div style="flex:1 1 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <label>JWT</label>
    <input id="token" style="flex:1;min-width:200px;font-family:monospace;font-size:11px" placeholder="access token">
    <button class="btn sm" onclick="saveToken()">Save</button>
    <button class="btn sm err" onclick="clearTokens()">Clear</button>
  </div>
</header>

<nav class="personas">
  <a data-actor="SUBMITTER" href="submitter.html">🙋 Submitter</a>
  <a data-actor="REVIEWER" href="reviewer.html">🔍 Reviewer</a>
  <a data-actor="ADMIN" href="admin.html">🛡️ Admin</a>
  <a data-actor="EVALUATOR" href="evaluator.html">🧑‍⚖️ Evaluator</a>
  <a data-actor="PORTAL" href="portal.html">🎓 Portal</a>
  <a data-actor="BATCH4" href="batch4.html">🚀 Batch 4</a>
</nav>

<main>
  <div class="left">
    <!-- Auth block similar to other pages -->
    <div class="card">
      <h3>Login</h3>
      <div class="row"><label>Phone</label><input id="aPhone" placeholder="10 digit phone"></div>
      <div class="row"><label>Email</label><input id="aEmail" placeholder="optional"></div>
      <div class="row">
        <button class="btn primary" onclick="auth('login')">Login</button>
        <button class="btn" onclick="auth('register')">Register</button>
      </div>
      <div class="row"><label>challengeId</label><input id="aChallenge"></div>
      <div class="row"><label>Code</label><input id="aCode"></div>
      <div class="row">
        <button class="btn primary" onclick="verifyOtp()">Verify OTP</button>
        <button class="btn warn" onclick="useDevOtp()">Use devOtp</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-tab="admin" onclick="tab('admin')">Admin Review</button>
      <button class="tab" data-tab="registry" onclick="tab('registry')">Registry</button>
      <button class="tab" data-tab="workspace" onclick="tab('workspace')">Workspace</button>
      <button class="tab" data-tab="industry" onclick="tab('industry')">Industry</button>
      <button class="tab" data-tab="messaging" onclick="tab('messaging')">Messaging</button>
      <button class="tab" data-tab="analytics" onclick="tab('analytics')">Analytics</button>
    </div>

    <!-- TAB: Admin Review -->
    <div id="panel-admin" class="tabpanel">
      <div class="card">
        <h3>Governance Reviews (Admin)</h3>
        <button class="btn primary" onclick="loadReviews()">Load Reviews</button>
        <div id="reviewsList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- TAB: Registry -->
    <div id="panel-registry" class="tabpanel" hidden>
      <div class="card">
        <h3>Registry Versions</h3>
        <button class="btn primary" onclick="loadVersions()">Load Versions</button>
        <div id="versionsList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- TAB: Workspace -->
    <div id="panel-workspace" class="tabpanel" hidden>
      <div class="card">
        <h3>Project Workspace</h3>
        <div class="row">
          <label>Project ID</label>
          <input id="projectId" class="fill mono" placeholder="UUID">
        </div>
        <button class="btn primary" onclick="loadTasks()">Load Tasks</button>
        <div id="tasksList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- TAB: Industry -->
    <div id="panel-industry" class="tabpanel" hidden>
      <div class="card">
        <h3>Industry Organizations</h3>
        <button class="btn primary" onclick="loadIndustry()">Load Organizations</button>
        <div id="industryList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- TAB: Messaging -->
    <div id="panel-messaging" class="tabpanel" hidden>
      <div class="card">
        <h3>Conversations</h3>
        <button class="btn primary" onclick="loadConversations()">Load Conversations</button>
        <div id="conversationsList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- TAB: Analytics -->
    <div id="panel-analytics" class="tabpanel" hidden>
      <div class="card">
        <h3>Impact Analytics</h3>
        <button class="btn primary" onclick="loadAnalytics()">Load Impact</button>
        <div id="analyticsContent" style="margin-top:10px"></div>
      </div>
    </div>

  </div>

  <div class="right">
    <div class="card" style="position:sticky;top:0">
      <div class="statusbar"><span id="outReq">—</span><span id="outStatus" class="badge">no request yet</span></div>
      <pre id="out" class="out">Response yahan aayega…</pre>
    </div>
  </div>
</main>

<script src="actor-core.js"></script>
<script>
'use strict';
const esc  = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tab(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tabpanel').forEach(p => { p.hidden = p.id !== 'panel-' + name; });
}

async function loadReviews() {
  const res = await api('GET', '/capability/governance/reviews');
  show('GET /capability/governance/reviews', res);
  if (res.ok) {
    document.getElementById('reviewsList').innerHTML = res.data.content.map(r => `
      <div class="crow">
        <div>Problem: ${esc(r.problemFingerprint?.problemId)}</div>
        <div>Match Result Count: ${r.matchResult?.recommendations?.length || 0}</div>
        <button class="btn sm ok" onclick="approveReview('${r.matchingRunId}')">Approve</button>
      </div>
    `).join('');
  } else {
    document.getElementById('reviewsList').innerHTML = '<div class="hint err">Failed to load reviews</div>';
  }
}

async function approveReview(id) {
  const res = await api('POST', `/capability/governance/reviews/${id}/approve`);
  show(`POST /capability/governance/reviews/${id}/approve`, res);
  loadReviews();
}

async function loadVersions() {
  const res = await api('GET', '/capability/registry/versions');
  show('GET /capability/registry/versions', res);
  if (res.ok) {
    document.getElementById('versionsList').innerHTML = res.data.content.map(v => `
      <div class="crow">
        <div>Version ID: ${v.versionId} (Status: ${v.status})</div>
      </div>
    `).join('');
  }
}

async function loadTasks() {
  const pId = document.getElementById('projectId').value;
  if (!pId) { flash('Enter Project ID'); return; }
  const res = await api('GET', `/capability/api/v1/projects/${pId}/tasks`);
  show(`GET /capability/api/v1/projects/${pId}/tasks`, res);
  if (res.ok) {
    document.getElementById('tasksList').innerHTML = res.data.map(t => `
      <div class="crow">
        <div>${esc(t.title)} - [${t.status}]</div>
      </div>
    `).join('');
  }
}

async function loadIndustry() {
  const res = await api('GET', '/capability/api/v1/industry/organizations');
  show('GET /capability/api/v1/industry/organizations', res);
  if (res.ok) {
    document.getElementById('industryList').innerHTML = res.data.map(o => `
      <div class="crow">
        <div>${esc(o.name)} - ${esc(o.contactEmail)}</div>
      </div>
    `).join('');
  }
}

async function loadConversations() {
  const res = await api('GET', '/capability/api/v1/conversations');
  show('GET /capability/api/v1/conversations', res);
  if (res.ok) {
    document.getElementById('conversationsList').innerHTML = res.data.map(c => `
      <div class="crow">
        <div>${esc(c.name || 'Conversation')} [${c.conversationType}] (Unread: ${c.unreadCount})</div>
      </div>
    `).join('');
  }
}

async function loadAnalytics() {
  const res = await api('GET', '/capability/api/v1/analytics/impact');
  show('GET /capability/api/v1/analytics/impact', res);
  if (res.ok) {
    const d = res.data;
    document.getElementById('analyticsContent').innerHTML = `
      <div class="statement">
        Projects Completed: ${d.projectsCompleted}<br>
        Citizen Feedback: ${d.citizenFeedbackCount}<br>
        Average Satisfaction: ${d.averageSatisfaction}<br>
        Institutions Involved: ${d.institutionsInvolved}
      </div>
    `;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (state.token) {
    // maybe auto load
  }
});
</script>
</body>
</html>
