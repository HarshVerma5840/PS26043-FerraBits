server:
  port: ${SERVER_PORT:8087}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-min-32-bytes-change-me!!}
    issuer: ${JWT_ISSUER:sih26043}
    access-token-ttl-minutes: ${JWT_TTL:60}

spring:
  application:
    name: capability-matching-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_capability}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

embedding:
  provider: mock
  api:
    url:
    key:

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
