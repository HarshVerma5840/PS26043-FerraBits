server:
  port: ${SERVER_PORT:${PORT:8086}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:sih26043}
    access-token-ttl-minutes: ${JWT_TTL:15}

spring:
  application:
    name: capability-matching-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sih_capability}
    username: ${DB_USERNAME:sih}
    password: ${DB_PASSWORD:sih}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}

embedding:
  provider: ${EMBEDDING_PROVIDER:mock}
  api:
    url: ${EMBEDDING_API_URL:}
    key: ${EMBEDDING_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
